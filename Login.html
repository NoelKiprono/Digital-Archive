<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | HeritageVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">HV</span>
      <div>
        <a class="brand-title" href="index.html">HeritageVault</a>
        <p class="brand-tagline">Digital Archives</p>
      </div>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="historical-records.html">Historical Records</a>
      <a href="photographs.html">Photographs</a>
      <a href="files.html">Files</a>
      <a href="record.html">Record Page</a>
      <a href="index.html#feedback">Feedback</a>
      <a class="nav-cta is-active" href="login.html">Login</a>
    </nav>
  </header>

  <main class="login-main">
    <section class="login-card">
      <p class="eyebrow">Member Access</p>
      <h1>Login to your archive account</h1>
      <p>
        Sign in to continue exploring saved searches, reference requests, and downloaded records.
      </p>

      <form class="login-form" data-login-form>
        <label for="login-email">Email address</label>
        <input id="login-email" name="email" type="email" placeholder="name@example.com" required>

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="Enter your password" required>

        <div class="login-options">
          <label class="checkbox">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="index.html#feedback">Need help?</a>
        </div>

        <button type="submit">Login</button>
        <p class="form-status" data-login-status aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
